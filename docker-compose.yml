services:
  jimaco-remisiones-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: jimaco-remisiones-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PASSWORD}
    ports:
      - "127.0.0.1:1436:1433"
    volumes:
      - jimaco-remisiones-db-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  jimaco-remisiones-api:
    build:
      context: .
      dockerfile: Jimaco.Remisiones.Api/Dockerfile
    container_name: jimaco-remisiones-api
    restart: unless-stopped
    depends_on:
      jimaco-remisiones-db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: Server=jimaco-remisiones-db,1433;Database=JimacoRemisiones;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;
      Jwt__Secret: ${JWT_SECRET}
      Jwt__Issuer: Jimaco.Remisiones
      Jwt__Audience: Jimaco.Remisiones
      Jwt__ExpiracionMinutos: "480"
      Cors__AllowedOrigins__0: http://localhost:4400
      # Datos de prueba (productos y compradores demo): solo si SEED_DATOS_DEMO=true en .env.
      Seed__DatosDemo: ${SEED_DATOS_DEMO:-false}
      Smtp__Host: ${SMTP_HOST:-}
      Smtp__Port: ${SMTP_PORT:-465}
      Smtp__UseSsl: ${SMTP_USE_SSL:-true}
      Smtp__Usuario: ${SMTP_USUARIO:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__RemitenteEmail: ${SMTP_REMITENTE:-}
      Correo__Contabilidad: ${CORREO_CONTABILIDAD:-contabilidad@jimaco.com.co}
    ports:
      - "8100:8080"

  jimaco-remisiones-web:
    build:
      context: ../Jimaco.Remisiones.Web
      dockerfile: Dockerfile
    container_name: jimaco-remisiones-web
    restart: unless-stopped
    depends_on:
      - jimaco-remisiones-api
    ports:
      - "4400:8080"


volumes:
  jimaco-remisiones-db-data:
